name: Verificações

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.13"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/sync_skills.py --check

  frontend:
    name: Frontend JavaScript
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container:
    name: Container e smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t capricornio-app:test .
      - name: Verificar porta configurável, API e interface
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name app-test -e PORT=8080 -p 127.0.0.1:8080:8080 capricornio-app:test
          trap 'docker logs app-test; docker rm -f app-test' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 --retry-max-time 45 --max-time 5 http://127.0.0.1:8080/api/health > /tmp/app-health.json
          curl --fail http://127.0.0.1:8080/ > /tmp/app-index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('/tmp/app-health.json').read_text()) == {'status': 'ok'}
          assert 'Capricórnio' in Path('/tmp/app-index.html').read_text()
          PY
